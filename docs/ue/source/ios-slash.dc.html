    <button role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 12px">

      <span style="padding: 0 8px">ledger-svc</span><span style="padding: 0 8px">Repo default</span>

    <div style="border-radius: 20px; background: #1D1D20; border: 1px solid #2C2C31; padding: 10px 4px 4px; display: flex; flex-direction: column; gap: 6px">
      <textarea aria-label="Message" rows="1" style="background: none; border: 0; outline: none; resize: none; padding: 0 8px; font-size: 16px; line-height: 1.4; color: #F1F1F3; font-family: 'JetBrains Mono', ui-monospace, monospace">/</textarea>
      <div style="display: flex; align-items: center; gap: 2px">
