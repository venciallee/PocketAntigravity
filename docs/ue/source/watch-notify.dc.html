<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch — approval notification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
</style>
</helmet>
<div style="width: 208px; height: 248px; position: relative; overflow: hidden; background: #000000; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.3; -webkit-font-smoothing: antialiased">
  <div style="padding: 12px 12px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 6px; height: 24px">
      <span style="width: 22px; height: 22px; border-radius: 11px; background: #1F2735; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8DB8FF" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><ellipse cx="12" cy="12" rx="9.5" ry="4" transform="rotate(-30 12 12)"></ellipse></svg>
      </span>
      <span style="font-size: 12px; color: #A0A0AA">Agents · now</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1px">
      <h1 style="margin: 0; font-size: 15px; font-weight: 700; color: #F2B866">Run this command?</h1>
      <span style="font-size: 12px; color: #A0A0AA">Rate limiter · step 5 of 7</span>
    </div>

    <code style="display: block; padding: 6px 8px; border-radius: 10px; background: #1C1C1F; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 15px; color: #E2E2E6; white-space: pre-wrap; word-break: break-all">vegeta attack -rate=2000/s -duration=30s</code>

    <button style="height: 40px; border-radius: 20px; background: #F2B866; color: #2A1A00; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Double tap" role="img"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10M12 9.5a1.5 1.5 0 0 1 3 0V12M9 11l-1.4-1.3a1.4 1.4 0 0 0-2 2L9 16c1 1.4 2.4 2.5 4.3 2.5h.7a4 4 0 0 0 4-4V12a1.5 1.5 0 0 0-3 0"></path><path d="M5 4.5a5 5 0 0 1 3-2M17 4.5a5 5 0 0 0-3-2"></path></svg>
      Allow
    </button>
    <button style="height: 40px; border-radius: 20px; background: #26262B; font-size: 14px; font-weight: 600; text-align: center">Deny</button>
    <a href="watch-voice.dc.html" style="height: 40px; border-radius: 20px; background: #26262B; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #F1F1F3; text-decoration: none">Reply by voice</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":208,"height":248}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
