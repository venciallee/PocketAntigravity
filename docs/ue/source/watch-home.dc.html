<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch — conversation list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
@keyframes agspin{to{transform:rotate(360deg)}}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
</style>
</helmet>
<div style="width: 208px; height: 248px; position: relative; overflow: hidden; background: #000000; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.3; -webkit-font-smoothing: antialiased">

  <!-- Toolbar: device (leading), voice (trailing); system clock sits between -->
  <div style="position: absolute; top: 8px; left: 12px; right: 12px; display: flex; justify-content: space-between">
    <a href="watch-devices.dc.html" aria-label="MacBook Pro, online. Switch device" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; position: relative; color: #F1F1F3">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="5" width="15" height="10" rx="1.5"></rect><path d="M2.5 19h19"></path></svg>
      <span style="position: absolute; right: 4px; top: 4px; width: 8px; height: 8px; border-radius: 4px; background: #6FD8A6; border: 1.5px solid #000000"></span>
    </a>
    <a href="watch-voice.dc.html" aria-label="New conversation by voice" style="width: 36px; height: 36px; border-radius: 18px; background: #8DB8FF; display: flex; align-items: center; justify-content: center; color: #0A1A33">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"></path></svg>
    </a>
  </div>

  <div style="position: absolute; top: 50px; left: 0; right: 0; bottom: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 5px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 2px">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">Agents</h1>
      <span style="font-size: 12px; color: #A0A0AA">MacBook Pro</span>
    </div>

    <a href="watch-notify.dc.html" style="display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 16px; background: #1C1C1F; text-decoration: none; color: inherit">
      <span style="width: 12px; height: 18px; display: flex; align-items: center; justify-content: center; flex: none"><span style="width: 9px; height: 9px; border-radius: 50%; background: #F2B866; box-shadow: 0 0 0 3px rgba(242,184,102,0.2)"></span></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rate limiter</span>
        <span style="font-size: 12px; color: #F2B866; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Approve command</span>
      </span>
    </a>

    <a href="watch-chat.dc.html" style="display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 16px; background: #1C1C1F; text-decoration: none; color: inherit">
      <span style="width: 12px; height: 18px; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="animation: agspin 1.1s linear infinite"><circle cx="8" cy="8" r="6" stroke="#2C3A52" stroke-width="2.4"></circle><path d="M8 2a6 6 0 0 1 6 6" stroke="#8DB8FF" stroke-width="2.4" stroke-linecap="round"></path></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Dark mode settings</span>
        <span style="font-size: 12px; color: #8DB8FF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Cloud · 2 of 5</span>
      </span>
    </a>

    <a href="watch-code.dc.html" style="display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 16px; background: #1C1C1F; text-decoration: none; color: inherit">
      <span style="width: 12px; height: 18px; display: flex; align-items: center; justify-content: center; flex: none"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8DB8FF"></span></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Upgrade to Go 1.25</span>
        <span style="font-size: 12px; color: #A0A0AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Done · <span style="color: #74DDA9">+42</span> <span style="color: #FF9B9B">−31</span></span>
      </span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":208,"height":248}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
