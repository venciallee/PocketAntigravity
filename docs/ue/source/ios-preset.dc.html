<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Permission preset menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0B0C}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
textarea{font:inherit;color:inherit}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0C; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased">

  <h1 aria-hidden="true" style="position: absolute; left: 36px; right: 36px; top: 318px; margin: 0; text-align: center; font-size: 26px; font-weight: 600; line-height: 1.3; color: #5A5A62">Welcome back, Alex. Where should we pick up?</h1>

  <!-- Composer, preset chip pressed -->
  <div style="position: absolute; left: 10px; right: 10px; bottom: 26px; border-radius: 26px; background: #141416; border: 1px solid #222226; padding: 6px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 2px; padding: 0 2px; height: 34px; font-size: 13px; color: #8E8E98">
      <span style="padding: 0 8px">ledger-svc</span><span style="padding: 0 8px">Repo default</span>
    </div>
    <div style="border-radius: 20px; background: #1D1D20; border: 1px solid #2C2C31; padding: 10px 4px 4px; display: flex; flex-direction: column; gap: 6px">
      <textarea aria-label="Message" rows="1" placeholder="Ask anything, @ to mention, / for actions" style="background: none; border: 0; outline: none; resize: none; padding: 0 8px; font-size: 16px; line-height: 1.4; color: #F1F1F3"></textarea>
      <div style="display: flex; align-items: center; gap: 2px">
        <span style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #A0A0AA"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span style="height: 36px; padding: 0 6px; display: flex; flex-direction: column; justify-content: center; line-height: 1.15; color: #8E8E98"><span style="font-size: 13px; color: #A0A0AA">Gemini 4 Neon</span><span style="font-size: 11px">Extra High</span></span>
        <span style="flex: 1"></span>
        <button aria-expanded="true" aria-label="Permission preset: Default" style="height: 36px; padding: 0 8px; border-radius: 10px; background: #34343A; display: flex; align-items: center; gap: 4px; font-size: 13px; color: #F1F1F3">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 19 6v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></svg>
          Default
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span style="width: 36px; height: 36px"></span>
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #2C2C31"></span>
      </div>
    </div>
  </div>

  <!-- Preset menu: same four presets as desktop, desktop wording -->
  <div role="menu" aria-label="Permission preset" style="position: absolute; right: 14px; bottom: 166px; width: 306px; border-radius: 18px; background: #222226; border: 1px solid #303036; box-shadow: 0 18px 50px rgba(0,0,0,0.6); padding: 6px; display: flex; flex-direction: column">
    <span style="padding: 8px 10px 6px; font-size: 13px; color: #8E8E98">Permissions for this conversation</span>
    <button role="menuitemradio" aria-checked="false" style="display: flex; align-items: flex-start; gap: 12px; padding: 10px; border-radius: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3 19 6v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">Request Review</span><span style="font-size: 13px; color: #8E8E98">Every command requires approval.</span></span>
    </button>
    <button role="menuitemradio" aria-checked="true" style="display: flex; align-items: flex-start; gap: 12px; padding: 10px; border-radius: 10px; background: #2C2C31">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8DB8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3 19 6v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Default</span><span style="font-size: 13px; color: #A0A0AA">Ask before sensitive operations.</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8DB8FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </button>
    <button role="menuitemradio" aria-checked="false" style="display: flex; align-items: flex-start; gap: 12px; padding: 10px; border-radius: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3 19 6v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">Auto</span><span style="font-size: 13px; color: #8E8E98">Automatically decide if commands run.</span></span>
    </button>
    <button role="menuitemradio" aria-checked="false" style="display: flex; align-items: flex-start; gap: 12px; padding: 10px; border-radius: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2B866" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3 19 6v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">Turbo</span><span style="font-size: 13px; color: #8E8E98">Run all commands without restrictions.</span></span>
    </button>
    <div aria-hidden="true" style="height: 1px; margin: 4px 10px; background: #303036"></div>
    <a href="ios-settings-more.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 10px; font-size: 13px; color: #A0A0AA; text-decoration: none">
      Default for new turns: Settings › Permissions
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</body>
</html>
