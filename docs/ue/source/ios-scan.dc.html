<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan Remote Control QR</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#050506}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
@keyframes agscan{0%{transform:translateY(0)}100%{transform:translateY(208px)}}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050506; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased">

  <section aria-label="Scan Remote Control QR" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; border-radius: 34px 34px 0 0; background: #141416; display: flex; flex-direction: column; padding: 8px 16px 0; box-sizing: border-box; gap: 14px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <span aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #4A4A50"></span>
      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; height: 44px">
        <a href="ios-settings.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 4px; color: #C2C2CA; font-size: 16px; text-decoration: none">Cancel</a>
        <h2 style="margin: 0; font-size: 17px; font-weight: 600">Scan Remote Control QR</h2>
        <button style="height: 44px; padding: 0 4px; color: #8DB8FF; font-size: 16px; font-weight: 600">Paste</button>
      </div>
    </div>

    <!-- Camera viewfinder -->
    <div style="position: relative; height: 300px; border-radius: 24px; background: #0C0D10; overflow: hidden; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="position: absolute; inset: 30px 50px; border-radius: 14px; background: #1C1E24; filter: blur(2px)"></div>
      <div style="position: relative; width: 220px; height: 220px">
        <svg width="220" height="220" viewBox="0 0 220 220" fill="none" aria-hidden="true" style="position: absolute; inset: 0"><path d="M2 38V14A12 12 0 0 1 14 2h24M182 2h24a12 12 0 0 1 12 12v24M218 182v24a12 12 0 0 1-12 12h-24M38 218H14A12 12 0 0 1 2 206v-24" stroke="#8DB8FF" stroke-width="4" stroke-linecap="round"/></svg>
        <svg width="140" height="140" viewBox="0 0 21 21" aria-hidden="true" style="position: absolute; left: 40px; top: 40px" shape-rendering="crispEdges">
          <rect width="21" height="21" fill="#E8E8EC"/>
          <path fill="#121214" d="M1 1h7v7H1zM13 1h7v7h-7zM1 13h7v7H1z"/>
          <path fill="#E8E8EC" d="M2 2h5v5H2zM14 2h5v5h-5zM2 14h5v5H2z"/>
          <path fill="#121214" d="M3 3h3v3H3zM15 3h3v3h-3zM3 15h3v3H3zM9 1h1v2H9zM11 2h1v3h-1zM9 4h2v1H9zM10 6h1v3h-1zM9 9h3v1H9zM1 9h2v1H1zM4 10h3v1H4zM13 9h2v2h-2zM16 10h4v1h-4zM18 12h2v2h-2zM13 13h2v1h-2zM15 14h1v3h-1zM17 15h3v1h-3zM13 16h2v4h-2zM16 18h1v2h-1zM18 17h2v1h-2zM9 11h1v2H9zM11 12h1v4h-1zM9 17h2v1H9z"/>
        </svg>
        <div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 6px; height: 2px; border-radius: 1px; background: #8DB8FF; box-shadow: 0 0 12px 2px rgba(141,184,255,0.6); animation: agscan 1.8s ease-in-out infinite alternate"></div>
      </div>
    </div>
    <p style="margin: 0; font-size: 14px; color: #C2C2CA; text-align: center">Open Antigravity on Mac/PC → click <strong style="font-weight: 600; color: #F1F1F3">Remote Control</strong> and point your camera at the QR code.</p>

    <button style="height: 46px; border-radius: 23px; background: #26262B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 16-5-5-8.5 8.5"/></svg>
      Choose QR from Photos
    </button>

    <!-- Manual entry -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="relay-link" style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #8E8E98; padding-left: 4px">Enter link or device ID manually</label>
      <div style="display: flex; gap: 8px">
        <input id="relay-link" placeholder="https://antigravity.google.com/r/... or device ID" style="flex: 1; min-width: 0; height: 46px; padding: 0 14px; border-radius: 14px; background: #1D1D20; border: 1px solid #2C2C31; outline: none; font-size: 14px; color: #F1F1F3; font-family: 'JetBrains Mono', ui-monospace, monospace">
        <a href="ios-settings.dc.html" style="height: 46px; padding: 0 16px; border-radius: 14px; background: #8DB8FF; color: #0A1A33; display: flex; align-items: center; font-weight: 600; text-decoration: none">Connect</a>
      </div>
    </div>

    <p style="margin: 0; padding: 0 4px; font-size: 12.5px; color: #8E8E98; line-height: 1.45">After scanning, sign in with Google once to connect through Cloud Relay. Same Wi-Fi? Direct LAN / Tailscale is used when available.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
