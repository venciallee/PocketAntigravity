<!doctype html>

<style>
body{margin:0;background:#0B0B0C}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
@keyframes agspin{to{transform:rotate(360deg)}}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0C; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased">

      </button>
    </div>

      <a href="ios-automations.dc.html" style="height: 44px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 16px; color: #E2E2E6; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        Automations
      </a>
      <button style="height: 44px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 16px; color: #E2E2E6">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12" rx="1.5"/><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 12.5h17"/></svg>

      </a>

        <a href="ios-display-options.dc.html" aria-label="Display options" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #8E8E98">

        </a>
      </div>

      <!-- Local project -->
      <div style="display: flex; align-items: center; height: 40px; padding-left: 14px; color: #A0A0AA">
        <a href="ios-project-detail.dc.html" style="flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none">

        <a href="Main.dc.html" aria-label="New conversation in ledger-svc" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #8E8E98">

        </a>
      </div>
      <a href="ios-chat.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px 0 42px; border-radius: 10px; background: #1C1C1F; text-decoration: none; color: #F1F1F3">
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Add rate limiter to /transfers</span>
        <span role="img" aria-label="Needs approval" style="width: 8px; height: 8px; border-radius: 50%; background: #F2B866; flex: none"></span>
      </a>
      <a href="ios-plan-review.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px 0 42px; border-radius: 10px; text-decoration: none; color: #E2E2E6">
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Fix flaky TestSettlementBatch</span>
        <span role="img" aria-label="Unread" style="width: 8px; height: 8px; border-radius: 50%; background: #4C8DFF; flex: none"></span>
      </a>
      <a href="ios-diff.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px 0 42px; border-radius: 10px; text-decoration: none; color: #E2E2E6">

      </a>
      <a href="ios-chat.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px 0 42px; border-radius: 10px; text-decoration: none; color: #E2E2E6">
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Idempotency keys for payouts</span>
        <span style="font-size: 13px; color: #8E8E98">1d</span>
      </a>

      <div style="display: flex; align-items: center; height: 40px; padding-left: 14px; margin-top: 4px; color: #A0A0AA">
        <a href="ios-project.dc.html" style="flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6-1.2A4.6 4.6 0 0 0 7 18.5z"/></svg>
          acme/web-console
        </a>
        <a href="Main.dc.html" aria-label="New conversation in acme/web-console" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #8E8E98">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </a>

      <a href="ios-chat.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px 0 42px; border-radius: 10px; text-decoration: none; color: #E2E2E6">
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Dark mode for settings page</span>

      <a href="ios-chat.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 14px 0 42px; border-radius: 10px; text-decoration: none; color: #E2E2E6">

        <span style="font-size: 13px; color: #8E8E98">2d</span>
      </a>
    </div>

    <div style="padding: 6px 12px 30px; border-top: 1px solid #1F1F23">
      <a href="ios-settings.dc.html" style="height: 44px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 16px; color: #E2E2E6; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
