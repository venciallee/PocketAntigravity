<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch — changed files</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
</style>
</helmet>
<div style="width: 208px; height: 248px; position: relative; overflow: hidden; background: #000000; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.3; -webkit-font-smoothing: antialiased">

  <div style="position: absolute; top: 8px; left: 12px; right: 64px; display: flex; align-items: center; gap: 8px">
    <a href="watch-chat.dc.html" aria-label="Back" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center; color: #F1F1F3; flex: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 700">Changes</span>
  </div>

  <div style="position: absolute; top: 48px; left: 0; right: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 4px">
    <span style="padding: 0 4px 2px; font-size: 12px; color: #A0A0AA">4 files · <span style="color: #74DDA9; font-family: 'JetBrains Mono', ui-monospace, monospace">+128</span> <span style="color: #FF9B9B; font-family: 'JetBrains Mono', ui-monospace, monospace">−14</span></span>

    <button style="display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 12px; background: #1C1C1F">
      <span aria-label="Added" style="width: 16px; height: 16px; border-radius: 4px; background: #13261D; color: #74DDA9; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">A</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ratelimit.go</span>
        <span style="font-size: 11px; color: #A0A0AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Per-tenant token bucket</span>
      </span>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.3; text-align: right; flex: none; color: #74DDA9">+96</span>
    </button>

    <button style="display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 12px; background: #1C1C1F">
      <span aria-label="Modified" style="width: 16px; height: 16px; border-radius: 4px; background: #1F2735; color: #8DB8FF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">M</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">router.go</span>
        <span style="font-size: 11px; color: #A0A0AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Limiter on POST /transfers</span>
      </span>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.3; text-align: right; flex: none; display: flex; flex-direction: column"><span style="color: #74DDA9">+12</span><span style="color: #FF9B9B">−6</span></span>
    </button>

    <button style="display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 12px; background: #1C1C1F">
      <span aria-label="Modified" style="width: 16px; height: 16px; border-radius: 4px; background: #1F2735; color: #8DB8FF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">M</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">config.go</span>
        <span style="font-size: 11px; color: #A0A0AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rate, burst, TTL settings</span>
      </span>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.3; text-align: right; flex: none; display: flex; flex-direction: column"><span style="color: #74DDA9">+14</span><span style="color: #FF9B9B">−2</span></span>
    </button>

    <button style="display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 12px; background: #1C1C1F">
      <span aria-label="Modified" style="width: 16px; height: 16px; border-radius: 4px; background: #1F2735; color: #8DB8FF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">M</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ratelimit_test.go</span>
        <span style="font-size: 11px; color: #A0A0AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Table tests with -race</span>
      </span>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; line-height: 1.3; text-align: right; flex: none; display: flex; flex-direction: column"><span style="color: #74DDA9">+6</span><span style="color: #FF9B9B">−6</span></span>
    </button>
  </div>

  <!-- Floating bottom actions over scrolling content -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(to bottom, rgba(0,0,0,0), #000000 60%)"></div>
  <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 6px">
    <button aria-label="Open on iPhone" style="width: 40px; height: 40px; border-radius: 20px; background: #26262B; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F1F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg>
    </button>
    <button style="flex: 1; height: 40px; border-radius: 20px; background: #8DB8FF; color: #0A1A33; font-size: 14px; font-weight: 600; text-align: center">Accept all</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":208,"height":248}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
