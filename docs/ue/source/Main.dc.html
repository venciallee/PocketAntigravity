<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0C; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased">

  </div>

    <div style="border-radius: 20px; background: #1D1D20; border: 1px solid #2C2C31; padding: 10px 4px 4px; display: flex; flex-direction: column; gap: 6px">

      <div style="display: flex; align-items: center; gap: 2px">
        <a href="ios-add-context.dc.html" aria-label="Add context" style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #F1F1F3">

        <span style="flex: 1"></span>
        <a href="ios-preset.dc.html" aria-label="Permission preset: Default" style="height: 36px; padding: 0 6px; border-radius: 10px; display: flex; align-items: center; gap: 4px; font-size: 13px; color: #C2C2CA; text-decoration: none">

        </a>
        <button aria-label="Dictate" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #C2C2CA">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg>
        </button>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
