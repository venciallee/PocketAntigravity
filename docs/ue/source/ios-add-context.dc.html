<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add context menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0B0C}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
textarea{font:inherit;color:inherit}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0C; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased">

  <h1 aria-hidden="true" style="position: absolute; left: 36px; right: 36px; top: 318px; margin: 0; text-align: center; font-size: 26px; font-weight: 600; line-height: 1.3; color: #5A5A62">Welcome back, Alex. Where should we pick up?</h1>

  <!-- Composer (same as desktop), + pressed -->
  <div style="position: absolute; left: 10px; right: 10px; bottom: 26px; border-radius: 26px; background: #141416; border: 1px solid #222226; padding: 6px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 2px; padding: 0 2px; height: 34px; font-size: 13px; color: #8E8E98">
      <span style="padding: 0 8px">ledger-svc</span><span style="padding: 0 8px">Repo default</span>
    </div>
    <div style="border-radius: 20px; background: #1D1D20; border: 1px solid #2C2C31; padding: 10px 4px 4px; display: flex; flex-direction: column; gap: 6px">
      <textarea aria-label="Message" rows="1" placeholder="Ask anything, @ to mention, / for actions" style="background: none; border: 0; outline: none; resize: none; padding: 0 8px; font-size: 16px; line-height: 1.4; color: #F1F1F3"></textarea>
      <div style="display: flex; align-items: center; gap: 2px">
        <button aria-label="Add context" aria-expanded="true" style="width: 36px; height: 36px; border-radius: 18px; background: #34343A; display: flex; align-items: center; justify-content: center; color: #F1F1F3">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span style="height: 36px; padding: 0 6px; display: flex; flex-direction: column; justify-content: center; line-height: 1.15; color: #8E8E98"><span style="font-size: 13px; color: #A0A0AA">Gemini 4 Neon</span><span style="font-size: 11px">Extra High</span></span>
        <span style="flex: 1"></span>
        <span style="height: 36px; padding: 0 6px; display: flex; align-items: center; font-size: 13px; color: #A0A0AA">Default</span>
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #2C2C31"></span>
      </div>
    </div>
  </div>

  <!-- Add Context menu: same five entries as desktop -->
  <div role="menu" aria-label="Add Context" style="position: absolute; left: 14px; bottom: 166px; width: 256px; border-radius: 18px; background: #222226; border: 1px solid #303036; box-shadow: 0 18px 50px rgba(0,0,0,0.6); padding: 6px; display: flex; flex-direction: column">
    <span style="padding: 8px 10px 6px; font-size: 13px; color: #8E8E98">Add Context</span>
    <button role="menuitem" style="height: 46px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 10px; font-size: 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5 12.2 19.3a5 5 0 0 1-7.1-7.1l8-8a3.4 3.4 0 0 1 4.8 4.8l-8 8a1.7 1.7 0 0 1-2.4-2.4l7.3-7.3"/></svg>
      Files
    </button>
    <button role="menuitem" style="height: 46px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 10px; font-size: 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
      Folder
    </button>
    <button role="menuitem" style="height: 46px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 10px; font-size: 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M15.5 12v1.5a2.5 2.5 0 0 0 5 0V12a8.5 8.5 0 1 0-3.4 6.8"/></svg>
      Mentions
    </button>
    <a href="ios-slash.dc.html" role="menuitem" style="height: 46px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 10px; font-size: 16px; color: #F1F1F3; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M14.5 8.5 9.5 15.5"/></svg>
      Actions
    </a>
    <button role="menuitem" style="height: 46px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 10px; font-size: 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="13" width="17" height="6.5" rx="1.5"/><path d="M5 13 7.5 5.5h9L19 13M7.5 16.25h.01"/></svg>
      <span style="flex: 1">Drive</span>
      <span style="font-size: 15px; color: #8DB8FF">Set up</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }

</script>
</body>
</html>
