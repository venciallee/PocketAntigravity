    <div style="display: flex; flex-direction: column; gap: 10px">

        <button role="radio" aria-checked="true" style="height: 32px; padding: 0 12px 0 8px; border-radius: 8px; background: #2E3545; color: #D6E3FF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500">

        <button role="radio" aria-checked="false" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #45454C; font-size: 14px; font-weight: 500">Every week</button>
      </div>
      <button style="display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 0 4px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C4C4CC" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span style="flex: 1; display: flex; flex-direction: column"><span>Time</span><span style="font-size: 13px; color: #A9A9B2">GMT+8:00 · from this phone</span></span>
        <span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">2:00 AM</span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 500; color: #8DB8FF">Model</span>
      <div role="radiogroup" aria-label="Model" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 40px; border: 1px solid #45454C; border-radius: 20px; overflow: hidden">
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; border-right: 1px solid #45454C">Flash Lite</button>
        <button role="radio" aria-checked="true" style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; background: #2E3545; color: #D6E3FF; border-right: 1px solid #45454C">

        </button>
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">Pro</button>
      </div>
    </div>

    <p style="margin: 0; font-size: 13px; color: #A9A9B2; line-height: 1.45">Runs unattended: anything that needs approval is denied automatically and the run shows up as Needs review.</p>
    <button style="align-self: flex-start; height: 40px; padding: 0 12px; margin-left: -12px; border-radius: 20px; color: #FF8F87; font-size: 14px; font-weight: 600">Delete automation</button>
