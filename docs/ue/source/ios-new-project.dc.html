<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create new project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B0B0C}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
a{color:#8DB8FF}a:hover{color:#B5D0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050506; color: #F1F1F3; font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased">

  <!-- Large sheet -->
  <section aria-label="New project" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; border-radius: 34px 34px 0 0; background: #1A1A1D; display: flex; flex-direction: column; padding: 8px 16px 0; box-sizing: border-box; gap: 16px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <span aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #4A4A50"></span>
      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; height: 44px">
        <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 4px; color: #C2C2CA; font-size: 16px; text-decoration: none">Cancel</a>
        <h2 style="margin: 0; font-size: 17px; font-weight: 600">New Project</h2>
        <span style="width: 52px"></span>
      </div>
    </div>

    <!-- Where it runs -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8E8E98; padding-left: 4px">Runs on</span>
      <div role="radiogroup" aria-label="Runs on" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #26262B">
        <button role="radio" aria-checked="false" style="height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; color: #C2C2CA">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="5" width="15" height="10" rx="1.5"></rect><path d="M2.5 19h19"></path></svg>
          MacBook Pro
        </button>
        <button role="radio" aria-checked="true" style="height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; background: #3A3A40; color: #F1F1F3">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6-1.2A4.6 4.6 0 0 0 7 18.5z"></path></svg>
          Cloud
        </button>
      </div>
      <span style="font-size: 13px; color: #8E8E98; padding-left: 4px">Runs in its own cloud VM and keeps working while your computer sleeps.</span>
    </div>

    <!-- Source -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8E8E98; padding-left: 4px">Source</span>
      <div role="radiogroup" aria-label="Source" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button role="radio" aria-checked="true" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: rgba(141,184,255,0.10); border: 1.5px solid #8DB8FF">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8DB8FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="6" r="2"></circle><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="8" r="2"></circle><path d="M7 8v8M17 10c0 4-10 2-10 6"></path></svg>
          <span style="font-weight: 600; font-size: 14px">GitHub repository</span>
        </button>
        <button role="radio" aria-checked="false" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: #26262B; border: 1.5px solid transparent">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2C2CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"></path></svg>
          <span style="font-weight: 600; font-size: 14px">Drive folder</span>
        </button>
      </div>
    </div>

    <!-- Repo picker -->
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: #26262B; border-radius: 12px; color: #8E8E98">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4-4"></path></svg>
        <input aria-label="Search repositories" placeholder="Search repositories" style="flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; color: #F1F1F3">
      </label>
      <div role="listbox" aria-label="Repositories" style="border-radius: 14px; background: #26262B; display: flex; flex-direction: column">
        <button role="option" aria-selected="true" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #333339">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px">acme/ledger-svc</span><span style="font-size: 12px; color: #8E8E98">Private · Go · updated 2h ago</span></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8DB8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </button>
        <button role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #333339">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px">acme/web-console</span><span style="font-size: 12px; color: #8E8E98">Private · TypeScript · updated 1d ago</span></span>
        </button>
        <button role="option" aria-selected="false" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px">acme/design-tokens</span><span style="font-size: 12px; color: #8E8E98">Public · updated 5d ago</span></span>
        </button>
      </div>
      <a href="https://github.com" style="font-size: 13px; padding-left: 4px; text-decoration: none">Missing a repo? Configure on GitHub</a>
    </div>

    <!-- Branch + worktree, name -->
    <div style="border-radius: 14px; background: #26262B; display: flex; flex-direction: column">
      <button style="display: flex; align-items: center; justify-content: space-between; min-height: 50px; padding: 0 14px; border-bottom: 1px solid #333339">
        <span>Branch &amp; worktree</span>
        <span style="display: flex; align-items: center; gap: 4px; color: #8E8E98; font-size: 14px"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace">main</span> · New worktree<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"></path></svg></span>
      </button>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; padding: 0 14px">
        <span>Name</span>
        <input value="ledger-svc-cloud" aria-label="Project name" style="flex: 1; min-width: 0; text-align: right; background: none; border: 0; outline: none; font-size: 15px; color: #C2C2CA">
      </label>
    </div>

    <a href="ios-project.dc.html" style="margin-top: auto; margin-bottom: 34px; height: 52px; border-radius: 26px; background: #8DB8FF; color: #0A1A33; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; text-decoration: none">Create Project</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
