name: PocketAntigravity
options:
  bundleIdPrefix: com.thousandtimes.agpocket
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.1"
  generateEmptyDirectories: true

settings:
  base:
    ANTIGRAVITY_BUNDLE_PREFIX: com.thousandtimes.agpocket
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 PocketAntigravity Contributors. Original app icon & client code. Independent third-party companion for Antigravity; Google and Antigravity are trademarks of Google LLC."

packages:
  AntigravityData:
    path: apps/ios/Packages/AntigravityData

targets:
  AGPocket:
    type: application
    platform: iOS
    sources:
      - path: apps/ios/App
        excludes:
          - "**/Info.plist"
      - path: apps/ios/SharedUI/DesignSystem
      - path: apps/ios/SharedUI/LiveActivity
      - path: apps/ios/Extensions/LiveActivity
        excludes:
          - "**/*Bundle*"
          - "**/Info.plist"
    dependencies:
      - package: AntigravityData
      - framework: shared/umbrella/build/XCFrameworks/debug/AntigravityShared.xcframework
        embed: false
      - target: AGPocketLiveActivity
        embed: true
      - target: AGPocketShare
        embed: true
      - target: AGPocketWatch
        embed: true
    info:
      path: apps/ios/App/Support/Info.plist
      properties:
        CFBundleName: "AGPocket"
        CFBundleDisplayName: "AG Pocket"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 PocketAntigravity Contributors. Original app icon & client code. Independent third-party companion for Antigravity; Google and Antigravity are trademarks of Google LLC."
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSUserActivityTypes:
          - com.thousandtimes.agpocket.handoff
        NSCameraUsageDescription: "Scan the Remote Control QR code from your paired desktop host."
        NSMicrophoneUsageDescription: "Dictate prompts in AG Pocket using real-time voice transcription."
        NSSpeechRecognitionUsageDescription: "Transcribe spoken voice prompts and live dictation directly into AG Pocket."
        NSFaceIDUsageDescription: "Authorize agent terminal commands and external permissions with Face ID."
        NSLocalNetworkUsageDescription: "Connect directly to your paired desktop host or Companion Bridge over LAN and Tailscale."
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.thousandtimes.agpocket.deeplink
            CFBundleURLSchemes:
              - agpocket
    settings:
      base:
        PRODUCT_NAME: AGPocket
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX)
        INFOPLIST_KEY_CFBundleDisplayName: "AG Pocket"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AGPocketWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: apps/ios/Watch
        excludes:
          - "**/Info.plist"
    dependencies:
      - package: AntigravityData
    info:
      path: apps/ios/Watch/Support/Info.plist
      properties:
        CFBundleName: "AGPocketWatch"
        CFBundleDisplayName: "AG Pocket"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 PocketAntigravity Contributors. Original app icon & client code. Independent third-party companion for Antigravity; Google and Antigravity are trademarks of Google LLC."
        NSMicrophoneUsageDescription: "Dictate prompts and voice replies directly from Apple Watch to AG Pocket."
        NSUserActivityTypes:
          - com.thousandtimes.agpocket.handoff
        WKApplication: true
        WKCompanionAppBundleIdentifier: "$(ANTIGRAVITY_BUNDLE_PREFIX)"
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_NAME: AGPocketWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: "AG Pocket"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AGPocketLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: apps/ios/Extensions/LiveActivity
        excludes:
          - "**/Info.plist"
      - path: apps/ios/SharedUI/LiveActivity
      - path: apps/ios/SharedUI/DesignSystem
    dependencies:
      - package: AntigravityData
    info:
      path: apps/ios/Extensions/LiveActivity/Info.plist
      properties:
        CFBundleName: "AGPocketLiveActivity"
        CFBundleDisplayName: "AG Pocket Live Activity"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 PocketAntigravity Contributors. Independent companion for Antigravity."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: AGPocketLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).LiveActivity
        INFOPLIST_KEY_CFBundleDisplayName: "AG Pocket Live Activity"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AGPocketShare:
    type: app-extension
    platform: iOS
    sources:
      - path: apps/ios/Extensions/Share
        excludes:
          - "**/Info.plist"
      - path: apps/ios/SharedUI/DesignSystem
    dependencies:
      - package: AntigravityData
    info:
      path: apps/ios/Extensions/Share/Info.plist
      properties:
        CFBundleName: "AGPocketShare"
        CFBundleDisplayName: "Send to AG Pocket"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 PocketAntigravity Contributors. Independent companion for Antigravity."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).AntigravityShareExtensionViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 5
    settings:
      base:
        PRODUCT_NAME: AGPocketShare
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).Share
        INFOPLIST_KEY_CFBundleDisplayName: "Send to AG Pocket"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANTIGRAVITY_SHARE_EXTENSION"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AGPocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tests/ios-ui
    dependencies:
      - target: AGPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AGPocket
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

  AGPocketWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: tests/watchos-ui
    dependencies:
      - target: AGPocketWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ANTIGRAVITY_BUNDLE_PREFIX).watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AGPocketWatch
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

schemes:
  AGPocket:
    build:
      targets:
        AGPocket: all
        AGPocketUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AGPocketUITests

  AGPocketWatch:
    build:
      targets:
        AGPocketWatch: all
        AGPocketWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AGPocketWatchUITests
