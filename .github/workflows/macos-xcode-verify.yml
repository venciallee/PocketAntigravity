name: macOS Xcode & iOS Simulator E2E Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-simulator-e2e:
    name: Swift 6 XCTest + Real Simulator XCUITest UI Taps + 13-Screen Capture
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 16+ on runner
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE="$(ls -d /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen & Pillow
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          python3 -m pip install --break-system-packages --quiet pillow || pip3 install --quiet pillow

      - name: "[Gate 0] Pure-Cloud Doc-Sync Watcher Self-Test & Script Syntax Check"
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync-antigravity-docs.py scripts/run-doc-sync-agent.py scripts/mac-companion-bridge.py verification/mock_language_server.py verification/verify-v233-capabilities.py
          python3 scripts/sync-antigravity-docs.py --self-test

      - name: "[Gate 1] Swift 6 Package Compilation & XCTest Suite (AntigravityData)"
        run: |
          set -euo pipefail
          mkdir -p verification/output/real-simulator
          swift test --package-path Packages/AntigravityData 2>&1 | tee verification/output/real-simulator/swift-test.log

      - name: "[Gate 2] Live Connect-RPC Protocol Flow (Login + StartCascade + SendMessage + Binary Proto + Face ID)"
        run: |
          set -euo pipefail
          python3 verification/verify-live-rpc-flow.py 2>&1 | tee verification/output/real-simulator/live-rpc-flow.log
          python3 verification/verify-v233-capabilities.py 2>&1 | tee verification/output/real-simulator/v233-capabilities.log

      - name: Set up JDK 21 for KMP Shared Core
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: "[Gate 2.5] Assemble KMP AntigravityShared.xcframework (Ktor Darwin + SKIE)"
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :shared:umbrella:assembleAntigravitySharedDebugXCFramework --no-daemon 2>&1 | tee verification/output/real-simulator/kmp-xcframework.log
          ls -la shared/umbrella/build/XCFrameworks/debug/AntigravityShared.xcframework

      - name: "[Gate 3-5] Real Simulator XCUITest UI Taps (AntigravityUITests) + Live App RPC + 13 Native Screenshots"
        run: |
          set -euo pipefail
          python3 verification/ios-simulator-runner.py 2>&1 | tee verification/output/real-simulator/simulator-runner.log

      - name: Upload Real iOS Simulator Screenshots & Verification Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ios-simulator-verification
          path: verification/output/real-simulator/
          if-no-files-found: warn
