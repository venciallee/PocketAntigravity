name: macOS Xcode & iOS Simulator E2E Verification

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*", "release-*"]
  pull_request:
    branches: [main, "release/**"]
  release:
    types: [created, published, prereleased, edited]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: "E2E Verification Mode (auto = impact-scoped, full = all iOS E2E, release = mandatory 100% Release E2E incl. KMP)"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - release
          - auto

jobs:
  plan-and-fast-gates:
    name: Impact Analysis + Fast Gates (DocSync, Compat Guardrails, Live RPC, ESDD)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      is_release: ${{ steps.plan.outputs.is_release }}
      needs_macos: ${{ steps.plan.outputs.needs_macos }}
      run_gate1: ${{ steps.plan.outputs.run_gate1 }}
      run_compat_guardrails: ${{ steps.plan.outputs.run_compat_guardrails }}
      run_gate2_live_rpc: ${{ steps.plan.outputs.run_gate2_live_rpc }}
      run_gate2_v233: ${{ steps.plan.outputs.run_gate2_v233 }}
      run_gate3_ios_build: ${{ steps.plan.outputs.run_gate3_ios_build }}
      ios_simulator_mode: ${{ steps.plan.outputs.ios_simulator_mode }}
      run_live_app_rpc: ${{ steps.plan.outputs.run_live_app_rpc }}
      run_kmp_full_release: ${{ steps.plan.outputs.run_kmp_full_release }}
      esdd_full: ${{ steps.plan.outputs.esdd_full }}
      esdd_needs_browser: ${{ steps.plan.outputs.esdd_needs_browser }}
      simulator_screens_csv: ${{ steps.plan.outputs.simulator_screens_csv }}

    steps:
      - name: Checkout repository (full history for accurate diff & version-bump detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Change Scope, Blast Radius & Release Triggers
        id: plan
        env:
          VERIFICATION_MODE_INPUT: ${{ inputs.verification_mode }}
        run: |
          set -euo pipefail
          mkdir -p verification/output
          python3 verification/e2e_impact_planner.py \
            --plan-out verification/output/e2e-plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: "[Gate 0] Script Syntax, Doc-Sync Watcher, Impact-Scoped Compat Guardrails & Planner Self-Test"
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/sync-antigravity-docs.py \
            scripts/run-doc-sync-agent.py \
            scripts/mac-companion-bridge.py \
            verification/mock_language_server.py \
            verification/verify-live-rpc-flow.py \
            verification/verify-v233-capabilities.py \
            verification/verify_compat_guardrails.py \
            verification/verify-compat-matrix.py \
            verification/e2e_impact_planner.py \
            verification/ios-simulator-runner.py \
            verification/esdd_inspector.py \
            verification/esdd-verify.py
          python3 scripts/sync-antigravity-docs.py --self-test
          if [ "${{ steps.plan.outputs.run_compat_guardrails }}" = "true" ] || [ "${{ steps.plan.outputs.is_release }}" = "true" ]; then
            python3 verification/verify_compat_guardrails.py
          else
            echo "[SKIP] Compatibility static guardrails skipped (Protocol/Models/Store/Bridge untouched)."
          fi
          python3 verification/e2e_impact_planner.py --self-test

      - name: "[Gate 2] Live Connect-RPC Flow, v2.33 Capabilities & 3-Version Compat Matrix (Legacy/Current/Future)"
        if: steps.plan.outputs.run_gate2_live_rpc == 'true' || steps.plan.outputs.run_gate2_v233 == 'true' || steps.plan.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          mkdir -p verification/output/fast-gates
          if [ "${{ steps.plan.outputs.run_gate2_live_rpc }}" = "true" ] || [ "${{ steps.plan.outputs.is_release }}" = "true" ]; then
            python3 verification/verify-live-rpc-flow.py 2>&1 | tee verification/output/fast-gates/live-rpc-flow.log
            python3 verification/verify-compat-matrix.py 2>&1 | tee verification/output/fast-gates/compat-matrix.log
          fi
          if [ "${{ steps.plan.outputs.run_gate2_v233 }}" = "true" ] || [ "${{ steps.plan.outputs.is_release }}" = "true" ]; then
            python3 verification/verify-v233-capabilities.py 2>&1 | tee verification/output/fast-gates/v233-capabilities.log
          fi

      - name: Install ESDD Headless Dependencies (when Stage 3/4 browser audit runs)
        if: steps.plan.outputs.esdd_needs_browser == 'true'
        run: |
          python3 -m pip install --break-system-packages --quiet pillow wsproto || pip3 install --quiet pillow wsproto

      - name: "[Gate 0b] ESDD Spec-DAG, Secret Hygiene & Impact-Scoped / Release Headless E2E"
        run: |
          set -euo pipefail
          python3 verification/esdd-verify.py --plan verification/output/e2e-plan.json

      - name: Upload E2E Verification Plan
        uses: actions/upload-artifact@v4
        with:
          name: e2e-verification-plan
          path: verification/output/e2e-plan.json
          retention-days: 7

  macos-simulator-e2e:
    name: Swift 6 XCTest + Real Simulator XCUITest & Native Screens
    needs: plan-and-fast-gates
    if: needs.plan-and-fast-gates.outputs.needs_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download E2E Verification Plan
        uses: actions/download-artifact@v4
        with:
          name: e2e-verification-plan
          path: verification/output

      - name: Select latest Xcode 16+ on runner
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE="$(ls -d /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: "[Gate 1] Swift 6 Package Compilation & XCTest Suite (AntigravityData)"
        if: needs.plan-and-fast-gates.outputs.run_gate1 == 'true'
        run: |
          set -euo pipefail
          mkdir -p verification/output/real-simulator
          swift test --package-path Packages/AntigravityData 2>&1 | tee verification/output/real-simulator/swift-test.log

      - name: Restore Cached KMP AntigravityShared.xcframework (skipped on release)
        id: kmp-xcf-cache
        if: needs.plan-and-fast-gates.outputs.run_gate3_ios_build == 'true' && needs.plan-and-fast-gates.outputs.is_release != 'true'
        uses: actions/cache@v4
        with:
          path: shared/umbrella/build/XCFrameworks/debug/AntigravityShared.xcframework
          key: kmp-xcframework-${{ runner.os }}-${{ hashFiles('shared/**', 'gradle/**', 'settings.gradle.kts', 'build.gradle.kts', 'gradle.properties') }}

      - name: Set up JDK 21 for KMP Shared Core
        if: needs.plan-and-fast-gates.outputs.run_gate3_ios_build == 'true' && (steps.kmp-xcf-cache.outputs.cache-hit != 'true' || needs.plan-and-fast-gates.outputs.is_release == 'true')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        if: needs.plan-and-fast-gates.outputs.run_gate3_ios_build == 'true' && (steps.kmp-xcf-cache.outputs.cache-hit != 'true' || needs.plan-and-fast-gates.outputs.is_release == 'true')
        uses: gradle/actions/setup-gradle@v4

      - name: "[Gate 2.5] Assemble KMP AntigravityShared.xcframework (Ktor Darwin + SKIE)"
        if: needs.plan-and-fast-gates.outputs.run_gate3_ios_build == 'true' && (steps.kmp-xcf-cache.outputs.cache-hit != 'true' || needs.plan-and-fast-gates.outputs.is_release == 'true')
        run: |
          set -euo pipefail
          mkdir -p verification/output/real-simulator
          chmod +x ./gradlew
          ./gradlew :shared:umbrella:assembleAntigravitySharedDebugXCFramework --no-daemon 2>&1 | tee verification/output/real-simulator/kmp-xcframework.log
          ls -la shared/umbrella/build/XCFrameworks/debug/AntigravityShared.xcframework

      - name: Install XcodeGen & Pillow (when iOS build / screenshots needed)
        if: needs.plan-and-fast-gates.outputs.run_gate3_ios_build == 'true'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if [ -n "${{ needs.plan-and-fast-gates.outputs.simulator_screens_csv }}" ] || [ "${{ needs.plan-and-fast-gates.outputs.is_release }}" = "true" ]; then
            python3 -m pip install --break-system-packages --quiet pillow || pip3 install --quiet pillow
          fi

      - name: "[Gate 3-5] Real Simulator XCUITest UI Taps + Live App RPC + Native Screenshots"
        if: needs.plan-and-fast-gates.outputs.run_gate3_ios_build == 'true'
        run: |
          set -euo pipefail
          mkdir -p verification/output/real-simulator
          cp verification/output/e2e-plan.json verification/output/real-simulator/e2e-plan.json
          PYTHONUNBUFFERED=1 python3 verification/ios-simulator-runner.py \
            --plan verification/output/e2e-plan.json 2>&1 | tee verification/output/real-simulator/simulator-runner.log

      - name: Upload Real iOS Simulator Screenshots & Verification Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ios-simulator-verification
          path: verification/output/real-simulator/
          if-no-files-found: warn

  release-full-kmp-e2e:
    name: "[Release Mandatory] Full KMP JVM + iOS Simulator XCFramework E2E"
    needs: plan-and-fast-gates
    if: needs.plan-and-fast-gates.outputs.is_release == 'true'
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Full KMP JVM, iOS Simulator & XCFramework Verification
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew jvmTest iosSimulatorArm64Test :shared:umbrella:assembleAntigravitySharedDebugXCFramework --no-daemon
          ls -la shared/umbrella/build/XCFrameworks/debug/AntigravityShared.xcframework
