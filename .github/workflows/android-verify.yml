name: Android Native Compose Verification (Lint + Roborazzi + Visual QA + Emulator E2E)

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "specs/android/**"
      - "verification/android_visual_compare.py"
      - "verification/mock_language_server.py"
      - ".github/workflows/android-verify.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "specs/android/**"
      - "verification/android_visual_compare.py"
      - "verification/mock_language_server.py"
      - ".github/workflows/android-verify.yml"
  release:
    types: [created, published, prereleased]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-jvm-and-roborazzi:
    name: Android Lint, Unit/E2E Tests, Roborazzi 13-Screen Capture & Visual Compare (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      android_emulator_e2e: ${{ steps.plan.outputs.android_emulator_e2e }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate Android Impact Scope
        id: plan
        run: |
          set -euo pipefail
          mkdir -p verification/output
          python3 verification/e2e_impact_planner.py \
            --plan-out verification/output/android-e2e-plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --quiet

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Bidirectional Compatibility Guardrails
        run: |
          set -euo pipefail
          python3 verification/verify_compat_guardrails.py

      - name: Assemble Debug APK, Lint, Roborazzi Capture & JVM Unit/Compose E2E Tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            :apps:android:app:assembleDebug \
            :apps:android:app:lintDebug \
            :apps:android:app:recordRoborazziDebug \
            :apps:android:app:testDebugUnitTest \
            --no-daemon

      - name: Generate iOS vs Android 13-Screen Side-by-Side Visual Comparisons
        run: |
          set -euo pipefail
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pillow || pip3 install --quiet pillow
          python3 verification/android_visual_compare.py
          ls -la verification/output/android/ verification/output/android/comparisons/

      - name: Upload Android Visual Comparisons Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-visual-comparisons
          path: |
            verification/output/android/comparisons/
            verification/output/android/ANDROID_13_SCREENS_OVERVIEW.png
            verification/output/android/android_visual_report.json
            apps/android/app/build/outputs/android_ue/
          if-no-files-found: warn
          retention-days: 14

  android-emulator-e2e:
    name: Android KVM Emulator Instrumented E2E (API 35 Pixel 6)
    needs: android-jvm-and-roborazzi
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.android-jvm-and-roborazzi.outputs.android_emulator_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable /dev/kvm hardware acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x ./gradlew

      - name: Run Android Instrumented E2E on KVM Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :apps:android:app:connectedDebugAndroidTest --no-daemon
