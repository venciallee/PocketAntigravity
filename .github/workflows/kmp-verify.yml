name: KMP Shared Core Verification (JVM + Mock Server E2E + iOS XCFramework)

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "verification/mock_language_server.py"
      - ".github/workflows/kmp-verify.yml"
  pull_request:
    paths:
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "verification/mock_language_server.py"
      - ".github/workflows/kmp-verify.yml"
  workflow_dispatch:

jobs:
  kmp-jvm-tests:
    name: KMP JVM Common + Mock LanguageServer E2E (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run KMP JVM & Mock LanguageServer E2E Tests
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :shared:core-model:jvmTest \
            :shared:core-protocol:jvmTest \
            :shared:core-markdown:jvmTest \
            :shared:umbrella:jvmTest \
            --no-daemon

  kmp-ios-xcframework:
    name: KMP iOS Simulator Tests + AntigravityShared.xcframework (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run KMP iOS Simulator Tests & Assemble AntigravityShared.xcframework
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :shared:core-model:iosSimulatorArm64Test \
            :shared:core-protocol:iosSimulatorArm64Test \
            :shared:core-markdown:iosSimulatorArm64Test \
            :shared:umbrella:iosSimulatorArm64Test \
            :shared:umbrella:assembleAntigravitySharedDebugXCFramework \
            --no-daemon
          ls -la shared/umbrella/build/XCFrameworks/debug/AntigravityShared.xcframework
