name: Client & Security Compliance CR Agent (Gemini CLI)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      additional_context:
        description: "Optional extra focus instructions for Gemini CLI review"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: cr-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    name: "[Stage 0] Config Validation, Rebase Skip & Fork Isolation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_review: ${{ steps.gate.outputs.should_review }}
      is_fork: ${{ steps.gate.outputs.is_fork }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      head_sha: ${{ steps.gate.outputs.head_sha }}

    steps:
      - name: Checkout repository (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate CR Rulebooks, review-context.toml & Gemini Command
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare-cr-context.py
          python3 scripts/prepare-cr-context.py --validate-config --self-test

      - name: Evaluate Fork Isolation, Draft & Pure-Rebase Skip (git patch-id)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          CR_TRIGGER_MODE: ${{ vars.CR_AGENT_MODE || 'auto' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          is_fork="false"
          should_review="true"
          base_sha="${BASE_SHA}"
          head_sha="${HEAD_SHA}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            base_sha="$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD~1)"
            head_sha="$(git rev-parse HEAD)"
          else
            if [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
              is_fork="true"
            fi

            if [ "${IS_DRAFT}" = "true" ]; then
              echo "PR is Draft; skipping automated review."
              should_review="false"
            fi

            if [ "${CR_TRIGGER_MODE}" = "label" ] && [[ ",${PR_LABELS}," != *",ai-review,"* ]]; then
              echo "CR_AGENT_MODE=label and 'ai-review' label absent; skipping."
              should_review="false"
            fi

            if [ "${should_review}" = "true" ] && [ "${EVENT_ACTION}" = "synchronize" ] && [ -n "${BEFORE_SHA}" ] && [ -n "${AFTER_SHA}" ]; then
              python3 scripts/prepare-cr-context.py \
                --check-rebase \
                --base-ref "origin/${BASE_REF}" \
                --before "${BEFORE_SHA}" \
                --after "${AFTER_SHA}" \
                --github-output "$GITHUB_OUTPUT"
              if grep -q "^pure_rebase=true$" "$GITHUB_OUTPUT" 2>/dev/null; then
                echo "Pure rebase detected via git patch-id; skipping redundant review."
                should_review="false"
              fi
            fi
          fi

          {
            echo "should_review=${should_review}"
            echo "is_fork=${is_fork}"
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"

  deterministic-security-gate:
    name: "[Stage 1] Deterministic Security Gate (Gitleaks, Semgrep, License & Guardrails)"
    needs: gatekeeper
    if: needs.gatekeeper.outputs.should_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Secret Scan (Gitleaks)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency CVE & Copyleft License Compliance
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0

      - name: Repository Bidirectional Compatibility Static Guardrails
        run: python3 verification/verify_compat_guardrails.py

      - name: Install Semgrep & Scan Client Security Rules (Diff-Baseline)
        env:
          BASE_SHA: ${{ needs.gatekeeper.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p cr-agent-out
          python3 -m pip install --quiet semgrep
          semgrep scan \
            --config .github/cr-rules/semgrep-client-security.yml \
            --baseline-commit "${BASE_SHA}" \
            --sarif-output cr-agent-out/semgrep.sarif \
            --json-output cr-agent-out/semgrep.json

      - name: Upload Semgrep SARIF to GitHub Code Scanning
        if: always() && needs.gatekeeper.outputs.is_fork != 'true' && hashFiles('cr-agent-out/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: cr-agent-out/semgrep.sarif
          category: client-security-semgrep

      - name: Upload Layer 1 Findings Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cr-layer1-findings
          path: cr-agent-out/
          retention-days: 14

      - name: Enforce Deterministic Layer 1 P0 Hard Gate (Semgrep ERROR)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys

          with open("cr-agent-out/semgrep.json", encoding="utf-8") as fh:
              data = json.load(fh)
          errors = [r for r in data.get("results", []) if r.get("extra", {}).get("severity") == "ERROR"]
          if errors:
              print(f"Layer 1 Semgrep P0 Hard Gate FAILED: {len(errors)} blocking finding(s).", file=sys.stderr)
              for r in errors:
                  print(f"  - [{r.get('check_id')}] {r.get('path')}:{r.get('start', {}).get('line', 1)} {r.get('extra', {}).get('message')}", file=sys.stderr)
              sys.exit(1)
          print("Layer 1 Deterministic P0 Hard Gate PASSED (0 Semgrep ERROR findings).")
          PY

  gemini-code-review:
    name: "[Stage 2] Official Gemini CLI Client & Security Review"
    needs: [gatekeeper, deterministic-security-gate]
    if: always() && needs.gatekeeper.result == 'success' && needs.gatekeeper.outputs.should_review == 'true' && needs.gatekeeper.outputs.is_fork != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download Layer 1 Semgrep Findings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cr-layer1-findings
          path: cr-agent-out

      - name: Prepare Path-Routed Rules & High-Risk Context (.gemini/context.json)
        env:
          BASE_SHA: ${{ needs.gatekeeper.outputs.base_sha }}
          HEAD_SHA: ${{ needs.gatekeeper.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context || '' }}
          LAYER1_RESULT: ${{ needs.deterministic-security-gate.result }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-cr-context.py \
            --prepare \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${PR_NUMBER}" \
            --semgrep-json cr-agent-out/semgrep.json \
            --compat-status "${LAYER1_RESULT}" \
            --additional-context "${ADDITIONAL_CONTEXT}" \
            --out .gemini/context.json \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Check Personal GEMINI_API_KEY Configuration
        id: gemini_auth
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GEMINI_API_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "> ℹ️ **Gemini CLI semantic review skipped**: Add your personal Google AI Studio \`GEMINI_API_KEY\` under **Settings → Secrets and variables → Actions** to activate automatic PR reviews."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "[SEC-CI-002] Assert Zero Persisted Write Credentials Before Gemini CLI"
        if: steps.gemini_auth.outputs.configured == 'true'
        run: |
          set -euo pipefail
          leaks="$(grep -rlE 'PRIVATE KEY|x-access-token|extraheader' .git/config "$HOME/.gitconfig" 2>/dev/null || true)"
          if [ -n "${leaks}" ]; then
            echo "::error::[SEC-CI-002] Credential material readable before Gemini CLI execution: ${leaks}"
            exit 1
          fi

      - name: Run Official Google Gemini CLI Client & Security Review
        if: steps.gemini_auth.outputs.configured == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        id: gemini_pr_review
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }}
          workflow_name: client-security-cr
          github_pr_number: ${{ github.event.pull_request.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_read",
                    "get_file_contents",
                    "add_comment_to_pending_review",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: "/client-security-review"
