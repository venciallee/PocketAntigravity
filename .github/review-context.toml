version = 1

[high_risk_paths]
# Touching any of these paths elevates the PR Risk Brief and adds a human
# verification checklist to the review summary.
patterns = [
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Protocol/PinnedTLSURLSessionDelegate.swift",
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Store/KeychainStore.swift",
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Store/SharedAppGroupBridge.swift",
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Protocol/CloudRelayProtocol.swift",
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Protocol/InteractionBuilder.swift",
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Store/AntigravitySessionStore+ChatAndInteractions.swift",
  "apps/ios/App/Application/AntigravityApp.swift",
  "apps/ios/Extensions/LiveActivity/**",
  "apps/ios/Extensions/Share/**",
  "apps/ios/SharedUI/LiveActivity/**",
  "project.yml",
  "**/Info.plist",
  "**/PrivacyInfo.xcprivacy",
  "**/AndroidManifest.xml",
  "**/network_security_config.xml",
  ".github/workflows/**",
  ".github/cr-rules/**",
  ".github/review-context.toml",
  ".gemini/commands/**",
]

[[rules]]
name = "iOS Swift 6 Concurrency, Lifecycle & UI Safety"
specialist = "client"
when = { any_file = { include = ["apps/ios/App/**", "apps/ios/Packages/**", "apps/ios/SharedUI/**"], ext = [".swift"] } }
load = [
  { type = "file", path = ".github/cr-rules/client-ios.md" },
]

[[rules]]
name = "iOS App Extensions Memory, Sandbox & Lock Screen Privacy"
specialist = "both"
when = { any_file = { include = ["apps/ios/Extensions/**", "apps/ios/SharedUI/LiveActivity/**"] } }
load = [
  { type = "file", path = ".github/cr-rules/client-ios.md" },
  { type = "file", path = ".github/cr-rules/security-compliance.md" },
]

[[rules]]
name = "TLS Pinning, Keychain, Auth, Deeplink & Protocol Security"
specialist = "security"
when = { any_file = { include = [
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Protocol/**",
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Store/KeychainStore.swift",
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Store/SharedAppGroupBridge.swift",
  "apps/ios/Packages/AntigravityData/Sources/AntigravityData/Store/AntigravitySessionStore+ChatAndInteractions.swift",
  "apps/ios/App/Application/AntigravityApp.swift",
  "apps/ios/App/Services/**",
  "scripts/mac-companion-bridge.py",
] } }
load = [
  { type = "file", path = ".github/cr-rules/security-compliance.md" },
]

[[rules]]
name = "KMP & Android Coroutines, Bridge & Contract Parity"
specialist = "client"
when = { any_file = { include = ["shared/**", "apps/ios/App/Bridge/**", "apps/android/**"], ext = [".kt", ".kts", ".swift", ".java"] } }
load = [
  { type = "file", path = ".github/cr-rules/client-kmp.md" },
]

[[rules]]
name = "Privacy Manifest, Permissions, ATS, Store & License Compliance"
specialist = "security"
when = { any_file = { include = [
  "project.yml",
  "**/Info.plist",
  "**/PrivacyInfo.xcprivacy",
  "**/AndroidManifest.xml",
  "**/network_security_config.xml",
  "apps/ios/Packages/AntigravityData/Package.swift",
  "gradle/libs.versions.toml",
  "**/*.gradle.kts",
  "NOTICE",
  "LICENSE",
] } }
load = [
  { type = "file", path = ".github/cr-rules/security-compliance.md" },
]

[[rules]]
name = "CI Workflows & CR Agent Supply-Chain Hardening"
specialist = "security"
when = { any_file = { include = [".github/workflows/**", ".gemini/commands/**", "scripts/prepare-cr-context.py"] } }
load = [
  { type = "file", path = ".github/cr-rules/security-compliance.md" },
]
